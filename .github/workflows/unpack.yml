name: Unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q -o journal-ios.zip -x ".github/workflows/*"
          unzip -p journal-ios.zip .github/workflows/build.yml > build.yml.txt
          rm journal-ios.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack project"
          git push
