name: Journal

options:
  bundleIdPrefix: com.eugggeneee
  developmentLanguage: ru
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Journal:
    type: application
    platform: iOS
    sources:
      - path: Journal
        excludes:
          - Info.plist
    info:
      path: Journal/Info.plist
      properties:
        CFBundleDisplayName: Journal
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugggeneee.journal
        PRODUCT_NAME: Journal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

  JournalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JournalTests
    dependencies:
      - target: Journal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugggeneee.journal.tests
        GENERATE_INFOPLIST_FILE: YES

  JournalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: JournalUITests
    dependencies:
      - target: Journal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugggeneee.journal.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Journal

schemes:
  Journal:
    build:
      targets:
        Journal: all
    test:
      targets:
        - JournalTests

  Screenshots:
    build:
      targets:
        Journal: all
    test:
      targets:
        - JournalUITests
